# Include inside the HTTPS server block for lumingchuan.vip.
client_max_body_size 100m;

location ^~ /fawn/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_redirect ~^https?://[^/]+(/api/.*)$ /fawn$1;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /fawn/storage/ {
    access_log off;
    # Restore the exact path used for the S3 signature; keep its Host and query.
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /fawn/download {
    alias /var/www/download/index.html;
    default_type text/html;
}

location ^~ /fawn/download/ {
    alias /var/www/download/;
    autoindex off;
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=300";
}

location = /fawn {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /fawn/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
